name: Build and check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lotc-character-journal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify independent core
        run: ./gradlew -PcoreOnly check --no-daemon --console=plain
      - name: Build Fabric mod
        run: ./gradlew check :fabric:build --no-daemon --console=plain
      - name: Verify smoke-runner evidence and timeout contracts
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Save test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: lotc-character-journal/**/build/reports/tests/
          if-no-files-found: ignore
      - name: Save development JARs
        uses: actions/upload-artifact@v4
        with:
          name: journal-jars
          path: lotc-character-journal/fabric/build/libs/*.jar
          if-no-files-found: error

  client-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: lotc-character-journal
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      ALSOFT_DRIVERS: 'null'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare virtual display and software OpenGL
        run: sudo apt-get update && sudo apt-get install --yes xvfb xauth libgl1-mesa-dri libglx-mesa0
      - name: Build client smoke harness and game assets
        timeout-minutes: 10
        run: ./gradlew :fabric:prepareClientSmoke --no-daemon --console=plain
      - name: Isolated graphics preflight, then development and installed-JAR smoke tests
        timeout-minutes: 28
        # EULA acceptance for this isolated automated test runtime was explicitly authorized.
        run: xvfb-run -a -s '-screen 0 1280x720x24 -nolisten tcp' python3 scripts/client_smoke.py --eula-accepted --prepared --timeout 300 --run-id ci-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload selected synthetic client evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-smoke-evidence
          path: |
            lotc-character-journal/fabric/build/client-smoke/evidence/**/*.json
            lotc-character-journal/fabric/build/client-smoke/evidence/**/*.xml
            lotc-character-journal/fabric/build/client-smoke/evidence/**/*.log
            lotc-character-journal/fabric/build/client-smoke/evidence/**/*.png
          if-no-files-found: warn
